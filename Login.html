<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="/styales.css">
</head>
<body>
		<div class="navbar">
            <img src="logo.png">
			<nav>
				<ul>
					<li><a href="/"><button type="button" class="btn js-trigger-transition">Home</button></a></li>
					<li><a href="/login"><button type="button" class="btn js-trigger-transition">Login</button></a></li>
					<li><a href="/register"><button type="button" class="btn js-trigger-transition">Sign Up</button></a></li>
				</ul>
			</nav>
		</div>
        <div class="loader">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
            <div class="bar4"></div>
            <div class="bar5"></div>
            <div class="bar6"></div>
          </div>
          
    <div id="form">
        <h1>Sign In</h1>
        <form action="/login" method="POST">
        <p>User Id</p>
        <input type="text" name="userid" placeholder="user_id">
        <p>Password</p>
        <input type="password" name="password" placeholder="Password"><br>
        <button>Login</button><br>
        </form>
        <a href="/register">New User?</a>
    </div>
    <script src="transition.js"></script>
</body>
</html>
