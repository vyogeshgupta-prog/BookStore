<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/styales.css">
</head>
<body>
    <div class="navbar">
    <img src="logo.png">
    <nav>
        <ul>
            <li><a href="/"><button type="button" class="btn js-trigger-transition">Home</button></a></li>
            <li><a href="/login"><button type="button" class="btn js-trigger-transition">Login</button></a></li>
            <li><a href="/register"><button type="button" class="btn js-trigger-transition">Sign Up</button></a></li>
        </ul>
    </nav>
</div>
<div class="loader">
    <div class="bar1"></div>
    <div class="bar2"></div>
    <div class="bar3"></div>
    <div class="bar4"></div>
    <div class="bar5"></div>
    <div class="bar6"></div>
  </div>
  
    <div id="form">
        <form action="/register" method="POST">
        <h1>Register</h1>
        <p>User Id</p>
        <input type="text" name="userid" placeholder="user_id" autocomplete="off">
        <p>First Name</p>
        <input type="text" name="firstname" placeholder="Name">
        <p>Last Name</p>
        <input type="text" name="lastname" placeholder="Last Name">
        <p>Mail Id</p>
        <input type="email" name="emailid" placeholder="E-mail">
        <p>Mobile Number</p>
        <input type="text" name="phonenumber" placeholder="Mobile Number">
        <p>Password</p>
        <input type="password" name="password" placeholder="Password" autocomplete="off">
        <p>Confirm Password</p>
        <input type="password" placeholder="Confirm"><br>
        <button type="submit">Register</button><br>
        </form>
        <a href="/login">Have an Account?</a>
    </div>
    <script src="transition.js"></script>
</body>
</html>
