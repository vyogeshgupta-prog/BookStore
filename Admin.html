<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Admin...</title>
    <link rel="stylesheet" href="/styales.css">
</head>
<body>
    <div class="navbar">
    <img src="logo.png">
    <nav>
        <ul>
            <li><a href="/"><button type="button" class="btn js-trigger-transition">Home</button></a></li>
            <li><a href="/login"><button type="button" class="btn js-trigger-transition">Login</button></a></li>
            <li><a href="/register"><button type="button" class="btn js-trigger-transition">Sign Up</button></a></li>
        </ul>
    </nav>
</div>
<div class="loader">
    <div class="bar1"></div>
    <div class="bar2"></div>
    <div class="bar3"></div>
    <div class="bar4"></div>
    <div class="bar5"></div>
    <div class="bar6"></div>
  </div>
  
    <div id="form">
        <form action="/admin" enctype="multipart/form-data" method="POST">
        <h1>Add</h1>
        <p>Book Image</p>
        <input type="file" name="img">
        <p>Book Name</p>
        <input type="text" name="bookname">
        <p>Author</p>
        <input type="text" name="author">
        <p>Category</p>
        <select type="text" name="category">
            <option value="fiction">Fiction</option>
            <option value="non-fiction">Non-Fiction</option>
        </select>
        <p>About book(Topic)</p>
        <input type="text" name="abt">
        <p>Price</p>
        <input type="text" name="price">
        <input type="hidden" name="formType" value="Add Product"><br>
        <button type="submit">Add Product</button><br>
        </form>
    </div>
    <div id="form">
        <form action="/admin" enctype="multipart/form-data" method="POST">
        <h1>Delete</h1>
        <p>Book Name</p>
        <input type="text" name="bookname">
        <input type="hidden" name="formType" value="Delete Product">
        <button type="submit" value="Delete Product">Delete Product</button><br>
        </form>
    </div>
    <script src="transition.js"></script>
</body>
</html>
